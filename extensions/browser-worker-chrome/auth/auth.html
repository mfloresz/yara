<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Autenticación del Worker</title>
    <style>
        /* Yara Browser Worker — auth
           Tokens mirror popup.css ("The Quiet Shelf"): one warm-stone ramp,
           colour only as semantic signal, flat surfaces with a 1px border,
           pill buttons. Light/dark follows the browser setting. */

        :root {
            color-scheme: light dark;

            --page:        #f5f4f2;
            --surface:     #fafaf9;
            --border:      #ddd9d3;
            --text:        #141413;
            --text-muted:  #57544c;

            --success: #16a34a;
            --danger:  #dc2626;

            --radius-lg:   16px;
            --radius-pill: 999px;
            --ease: 0.16s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page:        #121110;
                --surface:     #1b1a19;
                --border:      #3d3b35;
                --text:        #f5f4f2;
                --text-muted:  #b0aca4;

                --success: #4ade80;
                --danger:  #f87171;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::selection { background: color-mix(in oklab, var(--text) 16%, transparent); }

        body {
            font-family: Geist, Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--page);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .icon.success {
            background: color-mix(in oklab, var(--success) 14%, var(--surface));
            border: 1px solid color-mix(in oklab, var(--success) 32%, var(--border));
            color: var(--success);
        }
        .icon.error {
            background: color-mix(in oklab, var(--danger) 14%, var(--surface));
            border: 1px solid color-mix(in oklab, var(--danger) 32%, var(--border));
            color: var(--danger);
        }
        .icon svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 24px;
            background: var(--text);
            color: var(--page);
            border: none;
            border-radius: var(--radius-pill);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background var(--ease);
        }
        .btn:hover { background: color-mix(in oklab, var(--text) 85%, var(--page)); }
        .btn:focus-visible {
            outline: 2px solid var(--text-muted);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon success" id="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1 id="title">Procesando...</h1>
        <p id="message">Guardando token de autenticación...</p>
        <button class="btn" id="closeBtn" style="display: none;">Cerrar</button>
    </div>
    <script src="auth.js"></script>
</body>
</html>
